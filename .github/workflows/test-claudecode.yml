name: Test ClaudeCode Integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

jobs:
  test-claudecode:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
    
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.10'
    
    - name: Set up Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '20'
        package-manager-cache: false
    
    - name: Install Claude CLI
      run: |
        npm install -g @anthropic-ai/claude-code
    
    - name: Install dependencies
      run: |
        pip install pytest pytest-cov
        pip install -r claudecode/requirements.txt
        pip install -r claudecode/requirements-dev.txt
    
    - name: Run ClaudeCode unit tests
      run: |
        export PYTHONPATH="${PYTHONPATH}:${PWD}"
        pytest claudecode -v --cov=claudecode --cov-report=term-missing
    
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: latest
    
    - name: Install script dependencies
      run: |
        cd scripts
        bun install
    
    - name: Run comment script tests
      run: |
        cd scripts
        bun test comment-pr-findings.bun.test.js

    - name: Run Check Run script tests
      run: node --test scripts/check-run.test.js

    - name: Run bash script tests
      run: |
        chmod +x scripts/test-determine-claudecode-enablement.sh
        ./scripts/test-determine-claudecode-enablement.sh
